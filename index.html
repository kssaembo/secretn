<script>
const STORAGE='secret-number-class-v1', TYPES=['plus','multiply','divide','zero'];
const META={plus:{icon:'＋',name:'더하기'},multiply:{icon:'×',name:'곱하기'},divide:{icon:'÷',name:'나누기'},zero:{icon:'0',name:'0 개수'}};
const PHASES=['WAITING','SETTING','NUMBER_SELECT','PLAYING','SUBMIT','SCORING','FINISH'];
const PHASE_KO={WAITING:'대기',SETTING:'팀 설정',NUMBER_SELECT:'번호 선택',PLAYING:'게임 진행',SUBMIT:'답안 제출',SCORING:'채점',FINISH:'최종 결과'};
const ASSET='./assets/',avatarFiles=['avatar-1-Raccoon.png','avatar-2-parrot.png','avatar-3-turtle.png','avatar-4-lion.png','avatar-5-tiger.png','avatar-6-wolf.png','avatar-7-dragon.png','avatar-8-shark.png','avatar-9-panda.png','avatar-10-bear.png','avatar-11-fox.png','avatar-12-owl.png','avatar-13-rabbit.png','avatar-14-frog.png','avatar-15-monkey.png','avatar-16-butterfly.png','avatar-17-bee.png'];
const avatars=avatarFiles.map(f=>`<img class="asset-avatar" src="${ASSET}images/avatars/${f}" alt="플레이어 아바타">`);
const ticketFiles={plus:'ticket-plus.png',multiply:'ticket-multiply.png',divide:'ticket-divide.png',zero:'ticket-zero.png'};
const AUDIO_FILES={waiting:'audio/bgm/bgm-waiting.mp3',gameplay:'audio/bgm/bgm-gameplay.mp3',ranking:'audio/bgm/bgm-final-ranking.mp3',cardMovement:'audio/sfx/sfx-card-movement.wav',cardSelected:'audio/sfx/sfx-card-selected.wav',gameStart:'audio/sfx/sfx-game-start.wav',contactStart:'audio/sfx/sfx-contact-start.wav',processing:'audio/sfx/sfx-calculation-processing.wav',contactResult:'audio/sfx/sfx-contact-result.wav'};
const audioBank=Object.fromEntries(Object.entries(AUDIO_FILES).map(([k,v])=>[k,new Audio(ASSET+v)]));let activeBgm=null;
Object.values(audioBank).forEach(a=>a.preload='auto');['waiting','gameplay','ranking'].forEach(k=>{audioBank[k].loop=true;audioBank[k].volume=k==='gameplay'?.18:.24});
function avatarImg(t,size=''){return `<img class="asset-avatar ${size}" src="${ASSET}images/avatars/${avatarFiles[(t.id-1)%avatarFiles.length]}" alt="${esc(t.name)} 아바타">`}
function ticketImg(type){return `<img class="asset-ticket" src="${ASSET}images/tickets/${ticketFiles[type]}" alt="${META[type].name} 티켓">`}
function playSfx(name,volume=.65){if(!gameState.sound||!audioBank[name])return;const a=audioBank[name].cloneNode();a.volume=volume;a.play().catch(()=>{})}
function playBgm(name){if(!audioBank[name])return;if(activeBgm&&activeBgm!==name){audioBank[activeBgm].pause();audioBank[activeBgm].currentTime=0}activeBgm=name;audioBank[name].play().catch(()=>{})}
function desiredBgm(){if(gameState.phase==='FINISH')return'ranking';if(gameState.phase==='PLAYING'||gameState.phase==='SUBMIT')return'gameplay';return'waiting'}
function toggleMasterAudio(){gameState.sound=!gameState.sound;localStorage.setItem(STORAGE,JSON.stringify(gameState));if(gameState.sound)playBgm(desiredBgm());else Object.values(audioBank).forEach(a=>a.pause());render()}
function audioDock(){return `<button class="audio-control" onclick="toggleMasterAudio()">${gameState.sound?'🔊 음악·효과음':'🔇 음소거'}</button>`}
const colors=['#f59e0b','#3b82f6','#a855f7','#ef4444','#10b981','#ec4899','#06b6d4','#84cc16','#f97316','#8b5cf6','#14b8a6','#eab308','#6366f1','#f43f5e','#22c55e','#0ea5e9','#d946ef','#65a30d','#dc2626','#0891b2'];
function fresh(){return {version:2,code:String(Math.floor(1000+Math.random()*9000)),phase:'WAITING',difficulty:'medium',teamCount:0,timer:{left:3600,running:false,updatedAt:Date.now()},teams:[],rooms:Array.from({length:2},(_,i)=>({id:i+1,status:'available',a:null,b:null,startedAt:null,reservedBy:null})),results:null,sound:true};}
let gameState=load(), timerLoop=null, contactTimers={};
function load(){try{let x=JSON.parse(localStorage.getItem(STORAGE));x=x&&x.version?x:fresh();x.teams?.forEach((t,i)=>t.avatar=avatars[i%avatars.length]);return x}catch{return fresh()}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(gameState));render();}
function syncTimer(){if(gameState.timer.running){const now=Date.now(),elapsed=Math.floor((now-gameState.timer.updatedAt)/1000);if(elapsed>0){gameState.timer.left=Math.max(0,gameState.timer.left-elapsed);gameState.timer.updatedAt=now;if(!gameState.timer.left)gameState.timer.running=false;localStorage.setItem(STORAGE,JSON.stringify(gameState));}}}
function fmt(s){s=Math.max(0,s|0);return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function beep(kind='click'){try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=kind==='wrong'?'sawtooth':'sine';o.frequency.value={click:440,select:620,success:880,wrong:150,contact:740}[kind]||440;g.gain.setValueAtTime(.07,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.start();o.stop(c.currentTime+.18)}catch{}}
function showNotice(message,title='안내'){document.getElementById('fx').innerHTML=`<div class="overlay"><div class="glass rounded-3xl p-7 max-w-md w-full text-center pop"><div class="text-5xl">◇</div><h2 class="text-2xl font-black mt-4">${esc(title)}</h2><p class="text-slate-300 mt-3 leading-7">${esc(message)}</p><button class="btn btn-primary w-full mt-6" onclick="this.closest('.overlay').remove()">확인</button></div></div>`}
function syncPoint(){/* Documentation marker only. */}
function setPhase(p){
  // TODO: Google AI Studio - Firebase RTDB Sync Point
  gameState.phase=p; beep('select'); save(); if(p==='PLAYING')countdownFx();
}
function nextPhase(){setPhase(PHASES[Math.min(PHASES.length-1,PHASES.indexOf(gameState.phase)+1)])}
function timerAction(action){
  // TODO: Google AI Studio - Firebase RTDB Sync Point
  syncTimer(); if(action==='start'){gameState.timer.running=true;gameState.timer.updatedAt=Date.now()}if(action==='pause')gameState.timer.running=false;if(action==='reset')gameState.timer={left:3600,running:false,updatedAt:Date.now()};beep();save();
}
function setTeamCount(n){
  // TODO: Google AI Studio - Firebase RTDB Sync Point
  n=+n;while(gameState.teams.length<n){let i=gameState.teams.length;gameState.teams.push({id:i+1,name:`${i+1}팀`,avatar:avatars[i],color:colors[i],students:[`학생 ${i*2+1}`,`학생 ${i*2+2}`],number:null,tickets:{plus:2,multiply:2,divide:2,zero:2},answer:{},score:null})}gameState.teams=gameState.teams.slice(0,n);gameState.teamCount=n;gameState.results=null;save();
}
function updateTeam(id,field,value){
  // TODO: Google AI Studio - Firebase RTDB Sync Point
  const t=team(id);if(field==='students')t.students=value.split(/[,\n]/).map(x=>x.trim()).filter(Boolean);else t[field]=value;save();
}
function assignNumbers(){
  // TODO: Google AI Studio - Firebase RTDB Sync Point
  const max={easy:30,medium:60,hard:100}[gameState.difficulty],pool=Array.from({length:max},(_,i)=>i+1);for(let i=pool.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}gameState.teams.forEach((t,i)=>{t.number=pool[i];t.answer={};t.score=null});gameState.results=null;beep('select');document.querySelectorAll('.secret-card').forEach(x=>x.classList.add('shuffling'));setTimeout(save,1750);
}
function setDifficulty(v){gameState.difficulty=v;save()}
function regenerateCode(){
  // TODO: Google AI Studio - Firebase RTDB Sync Point
  gameState.code=String(Math.floor(1000+Math.random()*9000));save();
}
function setAnswer(teamId,targetId,value){
  // TODO: Google AI Studio - Firebase RTDB Sync Point
  team(teamId).answer[targetId]=value===''?'':Number(value);localStorage.setItem(STORAGE,JSON.stringify(gameState));
}
function calculateScores(){
  // TODO: Google AI Studio - Firebase RTDB Sync Point
  if(gameState.teams.some(t=>!t.number)){showNotice('먼저 모든 팀의 고유번호를 생성해 주세요.');return}const guessed=Object.fromEntries(gameState.teams.map(t=>[t.id,0]));const rows=gameState.teams.map(t=>{let base=0,all=true,own=0,others=0;gameState.teams.forEach(target=>{let a=t.answer[target.id];if(a===''||a==null){if(target.id!==t.id)all=false;return}let ok=Number(a)===target.number;if(target.id===t.id){own=ok?5:-5;base+=own}else{others+=ok?1:-1;base+=ok?1:-1;if(!ok)all=false;if(ok)guessed[target.id]++}});return {id:t.id,own,others,bonus:all?5:0,penalty:0,total:base+(all?5:0)}});rows.forEach(r=>{r.penalty=-guessed[r.id];r.total+=r.penalty;team(r.id).score=r.total});rows.sort((a,b)=>b.total-a.total);gameState.results=rows;gameState.phase='FINISH';beep('success');save();
}

function operation(type,a,b){const lo=Math.min(a,b),hi=Math.max(a,b);if(type==='plus')return a+b;if(type==='multiply')return(a*b)%10;if(type==='divide')return Math.floor(hi/lo);if(type==='zero'){let c=0;for(let n=lo+1;n<hi;n++)c+=(String(n).match(/0/g)||[]).length;return c}}

function runContact(r){

function kiosk(roomId){const r=gameState.rooms.find(x=>x.id==roomId);if(!r)return `<main class="p-10 text-center"><h1 class="text-4xl font-black">존재하지 않는 콘택트룸입니다.</h1><p class="mt-4 text-slate-400">관리자 화면에서 룸을 추가하세요.</p></main>`;const side=claimSeat(r);if(!side)return `<main class="min-h-screen grid place-items-center p-5"><section class="glass rounded-3xl p-10 max-w-lg text-center"><div class="text-7xl">⊘</div><h1 class="text-3xl font-black mt-5">접속할 수 없습니다</h1><p class="text-slate-400 mt-3 leading-7">콘택트룸 ${roomId}에는 이미 태블릿 2대가 연결되어 있습니다.</p><button class="btn mt-6" onclick="go('')">메인으로</button></section></main>`;if(r.status==='result')setTimeout(()=>startRoomCountdown(roomId),0);const other=side==='a'?'b':'a';return `<main class="max-w-3xl mx-auto p-4 md:p-7">${header(`콘택트룸 ${roomId}`,`이 태블릿은 ${side==='a'?'A':'B'} 좌석에 연결되었습니다.`)}${location.protocol==='file:'?`<div class="bg-red-950/70 border border-red-700 rounded-xl p-4 mb-4 text-red-200"><b>로컬 파일 직접 실행 중</b><p class="text-sm mt-1">두 태블릿 연동 테스트는 file://가 아닌 http://localhost 주소로 실행해 주세요.</p></div>`:''}<div>${playerPanel(r,side,`TABLET ${side.toUpperCase()}`)}</div><div class="glass rounded-xl p-4 mt-4 flex justify-between items-center"><span class="text-slate-400">상대 태블릿</span><b class="${r[other]?'text-emerald-400':'text-amber-400 animate-pulse'}">${r[other]?'연결 · 플레이어 선택 완료':'연결 또는 선택 대기 중'}</b></div><div class="mt-4 text-center"><button class="btn" onclick="releaseSeat(${r.id})">이 태블릿 연결 해제</button></div>${contactOverlay(r)}</main>`}
function playerPanel(r,side,label){let p=r[side];if(!p)return `<section class="glass rounded-2xl p-5 min-h-[430px]"><div class="label">${label} · STEP 1</div><h2 class="text-xl font-black mt-2">플레이어를 선택하세요</h2><div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-4">${gameState.teams.map(t=>`<button class="btn py-4" onclick="selectPlayer(${r.id},'${side}',${t.id})"><span class="text-3xl block">${t.avatar}</span><b>${esc(t.name)}</b></button>`).join('')}</div></section>`;let t=team(p.teamId);return `<section class="glass team-card rounded-2xl p-6 min-h-[430px]" style="--team:${t.color}"><div class="label">${label} · STEP 2</div><div class="text-center mt-2"><div class="text-5xl">${t.avatar}</div><h2 class="text-2xl font-black mt-2">${esc(t.name)}</h2></div><h3 class="font-black mt-6">상대방과 같은 티켓을 선택하세요</h3><div class="grid grid-cols-2 gap-3 mt-3">${TYPES.map(k=>`<button class="btn py-4 ${p.ticket===k?'btn-primary':''}" ${t.tickets[k]<1||p.ready||r.status==='processing'||r.status==='result'?'disabled':''} onclick="chooseTicket(${r.id},'${side}','${k}')"><span class="text-4xl block">${META[k].icon}</span><span>${META[k].name}</span><small class="block mt-1">남은 티켓 ${t.tickets[k]}장</small></button>`).join('')}</div><div class="grid grid-cols-2 gap-3 mt-5"><button class="btn" ${p.ready?'disabled':''} onclick="resetTicket(${r.id},'${side}')">다시 고르기</button><button class="btn btn-primary" ${!p.ticket||p.ready?'disabled':''} onclick="submitTicket(${r.id},'${side}')">${p.ready?'상대 제출 대기 중':'티켓 제출'}</button></div></section>`}
function contactOverlay(r){if(r.status==='processing')return `<div class="overlay"><div class="text-center"><div class="w-20 h-20 border-4 border-slate-700 border-t-amber-400 rounded-full animate-spin mx-auto"></div><h2 class="text-4xl font-black mt-6">연산 처리 중...</h2></div></div>`;if(r.status!=='result')return'';let a=team(r.a.teamId),b=team(r.b.teamId),sec=Math.max(0,Math.ceil((r.result.until-Date.now())/1000)),pct=Math.max(0,(r.result.until-Date.now())/100);return `<div class="overlay"><div class="glass rounded-3xl w-full max-w-3xl overflow-hidden pop"><div id="contactProgress" class="progress" style="width:${pct}%"></div><div class="p-8 md:p-12 text-center"><div class="label gold">CONTACT RESULT · <span id="contactSeconds">${sec}</span>초 후 자동 종료</div><div class="flex justify-center items-center gap-6 mt-6 text-2xl"><span>${a.avatar} ${esc(a.name)}</span><span class="text-slate-600">×</span><span>${b.avatar} ${esc(b.name)}</span></div><div class="text-7xl mt-8">${META[r.result.type].icon}</div><div class="label mt-5">연산 결과</div><div class="digit text-9xl gold mt-2">${r.result.value}</div><p class="text-slate-400 mt-7">고유번호는 공개되지 않습니다.</p></div></div></div>`}

['hard','상','생성되는 비밀 숫자의 범위가 1~100 사이입니다. 6학년 이상 추천합니다.'],['medium','중','생성되는 비밀 숫자의 범위가 1~60 사이입니다. 4,5학년 추천합니다.'],['easy','하','생성되는 비밀 숫자의 범위가 1~30 사이입니다. 중,저학년 추천합니다.']].map(([v,n,tip])=>`<div class="tip-wrap"><button data-option="gameDifficulty" data-value="${v}" class="btn option-btn w-full text-2xl py-4 ${gameState.difficulty===v?'selected':''}" onclick="pickSetupOption('gameDifficulty','${v}')">${n}</button><div class="hover-tip">${tip}</div></div>`).join('')}</div><p class="text-sm text-slate-400 text-center mt-4">마우스 커서를 갖다대면 난이도에 대한 설명이 나타납니다.</p></div><div class="border-t border-slate-700 pt-7"><div class="label">CONTACT ROOMS</div><h3 class="text-xl font-black mt-1">콘택트룸 수</h3><input id="roomCount" type="hidden" value="${Math.min(3,gameState.rooms.length)}"><div class="grid grid-cols-3 gap-3 mt-5">${[1,2,3].map(n=>`<button data-option="roomCount" data-value="${n}" class="btn option-btn text-2xl py-4 ${gameState.rooms.length===n?'selected':''}" onclick="pickSetupOption('roomCount','${n}')">${n}</button>`).join('')}</div><p class="text-sm text-slate-400 text-center leading-6 mt-4">비밀 숫자 추리를 위한 비밀의 방 수를 설정합니다.<br>가능한 공간에 따라 설정하시고 2개 정도가 적당합니다.</p></div></div></section><div class="flex justify-between mt-7"><button class="btn" onclick="go('')">이전</button><button class="btn btn-primary text-lg px-12" onclick="saveSetup(true)">다음 · 카드 선택</button></div></main>`}

function buildGameLog(){const lines=[`비밀 숫자 학급 에디션`, `게임 코드\t${gameState.code}`,`난이도\t${gameState.difficulty}`,`게임 결과`,`순위\t플레이어\t비밀 숫자\t친구 정답 점수\t보너스\t피추리 감점\t총점`,...gameState.results.map((r,i)=>`${i+1}\t${team(r.id).name}\t${team(r.id).number}\t${r.others}\t${r.bonus}\t${r.penalty}\t${r.total}`),``,`제출 답안 기록`,`제출자\t대상\t예상 숫자\t실제 숫자\t결과`];gameState.teams.forEach(t=>gameState.teams.forEach(x=>lines.push(`${t.name}\t${x.name}${x.id===t.id?' (내 번호)':''}\t${t.answer[x.id]??''}\t${x.number}\t${Number(t.answer[x.id])===x.number?'정답':'오답'}`)));lines.push('',`콘택트룸 과정 로그`,`시간\t방\t플레이어\t티켓\t연산 결과`);(gameState.activityLogs||[]).forEach(x=>lines.push(`${new Date(x.at).toLocaleString('ko-KR')}\t${x.roomId}\t${x.players.map(id=>team(id)?.name).join(' vs ')}\t${META[x.ticket]?.name||x.ticket}\t${x.result}`));return lines.join('\n')}

function showCelebration(){if(document.getElementById('celebration'))return;const colors=['#f59e0b','#3b82f6','#ef4444','#10b981','#f8fafc'],bits=Array.from({length:80},(_,i)=>`<i class="confetti" style="--x:${(i*37)%100}%;--c:${colors[i%colors.length]};--d:${2.4+(i%7)*.25}s;--delay:${(i%13)*-.14}s;--r:${i*23}deg"></i>`).join('');document.body.insertAdjacentHTML('beforeend',`<div id="celebration" class="celebration">${bits}</div>`)}

function resultBoardV3(){const top=gameState.results.slice(0,3),rest=gameState.results.slice(3);return `<main class="min-h-screen p-5 md:p-8"><div class="max-w-7xl mx-auto text-center"><div class="flex flex-wrap justify-between items-center gap-4"><div class="text-left"><div class="label gold">FINAL RANKING</div><h1 class="text-5xl md:text-7xl font-black mt-1">최종 결과</h1></div><button class="btn btn-primary text-lg !font-normal" onclick="confirmCopyGameLog()">게임 결과/과정 로그 복사하기</button></div><div class="grid md:grid-cols-3 gap-5 mt-10 items-end">${top.map((r,i)=>{const t=team(r.id);return `<article class="result-player glass rounded-3xl p-7 pop ${i===0?'rank1 md:order-2 md:pb-14':'md:order-'+(i===1?1:3)}" onclick="showFinalPlayerDetail(${r.id})"><img class="asset-medal" src="${ASSET}images/medals/medal-${i+1}${i===0?'st':i===1?'nd':'rd'}.png" alt="${i+1}위"><div class="mt-4">${avatarImg(t,'lg')}<b class="text-3xl md:text-4xl block mt-2">${esc(t.name)}</b></div><div class="digit text-6xl gold mt-4">${r.total}<small class="text-lg">점</small></div><span class="result-detail-cue" title="세부 정보 보기">↗</span></article>`}).join('')}</div><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mt-8">${rest.map((r,i)=>`<button class="result-player glass rounded-xl p-4 pr-12 flex justify-between items-center text-left" onclick="showFinalPlayerDetail(${r.id})"><b>${i+4}위 · ${esc(team(r.id).name)}</b><span class="gold font-black text-xl">${r.total}점</span><span class="result-detail-cue" title="세부 정보 보기">↗</span></button>`).join('')}</div><p class="text-slate-400 mt-7">플레이어를 누르면 비밀 숫자와 제출 기록을 확인할 수 있습니다.</p></div></main>`}

function enhanceAssetsV2(){document.querySelectorAll('button[onclick*="chooseTicket"]').forEach(b=>{const m=b.getAttribute('onclick')?.match(/'(plus|multiply|divide|zero)'/),s=b.querySelector('span.text-4xl');if(m&&s){s.outerHTML=ticketImg(m[1]);b.classList.add('ticket-choice');if(b.classList.contains('btn-primary'))b.classList.add('selected')}});const resultIcon=document.querySelector('#contactProgress')?.parentElement.querySelector('.text-7xl');if(resultIcon){const r=gameState.rooms.find(x=>x.status==='result');if(r)resultIcon.outerHTML=ticketImg(r.result.type)}}
function countdownFxV2(){let n=3;const fx=document.getElementById('fx'),draw=()=>{fx.innerHTML=`<div class="overlay"><div class="digit gold text-[26vw] leading-none pop">${n||'START'}</div></div>`;if(!n)playSfx('gameStart',.8)};draw();const h=setInterval(()=>{n--;draw();if(n<0){clearInterval(h);fx.innerHTML=''}},850)}
function finalRevealFxV2(){let n=3;const fx=document.getElementById('fx'),draw=()=>{fx.innerHTML=`<div class="overlay"><div class="digit gold text-[25vw] leading-none pop">${n||'FINAL'}</div></div>`;n?beep('click'):playSfx('cardSelected',.7)};draw();const timer=setInterval(()=>{n--;draw();if(n<0){clearInterval(timer);fx.innerHTML='';showCelebration()}},800)}
function toggleMasterAudioV2(){gameState.bgmPlaying=gameState.bgmPlaying===false;localStorage.setItem(STORAGE,JSON.stringify(gameState));if(gameState.bgmPlaying)playBgm(desiredBgm());else ['waiting','gameplay','ranking'].forEach(k=>audioBank[k].pause());const dock=document.querySelector('.audio-dock-v2 button');if(dock)dock.textContent=gameState.bgmPlaying?'⏸ 일시정지':'▶ 재생'}
function updateTimerOnly(){syncTimer();const mode=new URLSearchParams(location.search).get('mode')||'home';if(mode==='board'||mode==='game'){const timer=[...document.querySelectorAll('.digit')].find(x=>/^\d{2}:\d{2}$/.test(x.textContent.trim()));if(timer)timer.textContent=fmt(gameState.timer.left)}}
function applyTimerDom(){const mode=new URLSearchParams(location.search).get('mode')||'home';if(mode==='board'||mode==='game'){const timer=[...document.querySelectorAll('.digit')].find(x=>/^\d{2}:\d{2}$/.test(x.textContent.trim()));if(timer)timer.textContent=fmt(gameState.timer.left)}}
function ensurePageBgmV2(){const mode=new URLSearchParams(location.search).get('mode')||'home';if(mode!=='board'){['waiting','gameplay','ranking'].forEach(k=>audioBank[k].pause());return}gameState.volume=gameState.volume??.24;gameState.bgmPlaying=gameState.bgmPlaying!==false;applyMasterVolume(gameState.volume);if(gameState.bgmPlaying)playBgm(desiredBgm());else ['waiting','gameplay','ranking'].forEach(k=>audioBank[k].pause())}

  `<h2 class="text-4xl md:text-5xl font-black gold">결과 제출과 공개</h2><div class="flex flex-col md:flex-row items-stretch gap-3 mt-10 text-lg">${['운영자가 게임 종료','플레이어별 결과지 제출','전원 제출 확인','집계 및 결과 공개','전광판 최종 순위'].map((x,i)=>`<div class="glass rounded-xl p-5 flex-1"><b class="gold text-2xl">${i+1}</b><p class="mt-2">${x}</p></div>`).join('')}</div>`,

function showGuideV2(index=0){modalFlow={type:'guide',index};document.body.style.overflow='hidden';const content=guideSlides[index];document.getElementById('fx').innerHTML=`<div class="overlay"><section class="glass mega-modal rounded-3xl p-5 md:p-8"><header class="flex justify-between items-center"><div class="label gold">GAME GUIDE · ${index+1} / 5</div><button type="button" class="btn" onclick="closeGameModal()">닫기 ✕</button></header><div class="modal-slide flex-1 overflow-auto grid place-items-center text-center p-3 md:p-7"><div class="w-full">${content}</div></div><footer class="grid grid-cols-3 items-center gap-3"><button type="button" class="btn justify-self-start" ${index===0?'disabled':''} onclick="showGuideV2(${index-1})">← 이전</button>${modalDots(5,index)}<button type="button" class="btn btn-primary justify-self-end" ${index===4?'onclick="closeGameModal()"':'onclick="showGuideV2('+(index+1)+')"'}>${index===4?'완료':'다음 →'}</button></footer></section></div>`}

const introQuizzes=[{q:'24 이상 25 미만인 자연수는?',options:[23,24,25],answer:24,why:'24는 24 이상에 포함되고 25 미만입니다.'},{q:'36 초과 38 미만인 자연수는?',options:[36,37,38],answer:37,why:'36은 포함하지 않고 38보다 작은 자연수는 37입니다.'},{q:'51 초과 52 이하인 자연수는?',options:[51,52,53],answer:52,why:'51은 포함하지 않고 52는 이하에 포함됩니다.'}];
function startIntro(){modalFlow={type:'intro',index:0,correct:false};document.body.style.overflow='hidden';renderIntro()}
function renderIntro(){const s=modalFlow,index=s.index;let content='';if(index===0){const cards=[['이상','기준이 되는 수를 포함하여 그보다 큰 수','10 이상 → 10 포함'],['이하','기준이 되는 수를 포함하여 그보다 작은 수','10 이하 → 10 포함'],['초과','기준이 되는 수를 포함하지 않고 그보다 큰 수','10 초과 → 10 미포함'],['미만','기준이 되는 수를 포함하지 않고 그보다 작은 수','10 미만 → 10 미포함']];content=`<div class="intro-concepts"><h2 class="text-3xl md:text-5xl font-black">수의 범위를 먼저 익혀볼까요?</h2><p class="text-slate-400 mt-3">카드를 눌러 의미와 예시를 확인하세요.</p><div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 mt-7">${cards.map(([a,b,c])=>`<button type="button" class="learn-card" onclick="this.classList.toggle('flipped')"><span class="learn-card-inner"><span class="learn-face"><b class="text-4xl gold">${a}</b></span><span class="learn-face learn-back"><span><b class="text-2xl gold">${a}</b><span class="block mt-3 leading-7">${b}</span><strong class="block mt-4 text-amber-200">${c}</strong></span></span></span></button>`).join('')}</div></div>`}else if(index<=3){const q=introQuizzes[index-1];content=`<div id="quizBox" class="max-w-4xl mx-auto"><div class="label gold">QUIZ ${index} / 3</div><h2 class="text-3xl md:text-5xl font-black mt-4">${q.q}</h2><div class="grid grid-cols-3 gap-4 mt-10">${q.options.map(o=>`<button type="button" class="btn text-3xl md:text-5xl py-8" onclick="answerIntro(${o})">${o}</button>`).join('')}</div><div id="quizFeedback" class="min-h-20 mt-6 text-xl"></div></div>`}else{content=`<div class="max-w-5xl mx-auto py-6"><div class="label gold">READY</div><h2 class="text-4xl md:text-7xl font-black leading-[1.85] mt-6">수의 범위를 모두 알았다면,<br>이제 게임을 시작하지.</h2><p class="text-xl md:text-3xl text-red-300 mt-12 leading-[2]">비밀 숫자를 맞히지 못한다면<br>넌 이곳에서 빠져나갈 수 없다!!</p><button type="button" class="btn btn-primary text-2xl px-14 py-5 mt-14" onclick="closeGameModal();go('setup')">시크릿 넘버 시작</button></div>`}document.getElementById('fx').innerHTML=`<div class="overlay"><section class="glass mega-modal rounded-3xl p-5 md:p-8"><header class="flex justify-between items-center"><div class="label gold">NUMBER RANGE INTRO · ${index+1} / 5</div><button type="button" class="btn" onclick="confirmSkipIntro()">인트로 건너뛰기</button></header><div class="modal-slide flex-1 overflow-auto grid place-items-center text-center p-3 md:p-7">${content}</div><footer class="grid grid-cols-3 items-center gap-3"><button type="button" class="btn justify-self-start" ${index===0||index===4?'disabled':''} onclick="introMove(-1)">← 이전</button>${modalDots(5,index)}<button type="button" id="introNext" class="btn btn-primary justify-self-end" ${index>0?'disabled':''} ${index===0?'onclick="introMove(1)"':''}>다음 →</button></footer></section></div>`}
function introMove(delta){modalFlow.index=Math.max(0,Math.min(4,modalFlow.index+delta));modalFlow.correct=false;renderIntro()}
function answerIntro(value){const q=introQuizzes[modalFlow.index-1],box=document.getElementById('quizBox'),feedback=document.getElementById('quizFeedback');if(value===q.answer){modalFlow.correct=true;feedback.innerHTML=`<p class="text-emerald-400 font-black">✓ 정답입니다!</p><p class="text-slate-300 mt-1">${q.why}</p>`;const next=document.getElementById('introNext');next.disabled=false;next.onclick=()=>introMove(1);playSfx('cardSelected',.45)}else{feedback.innerHTML='<p class="text-red-400 font-black">다시 생각해 보세요.</p>';box.classList.remove('quiz-wrong');void box.offsetWidth;box.classList.add('quiz-wrong');beep('wrong')}}
function confirmSkipIntro(){document.getElementById('fx').innerHTML=`<div class="overlay"><div class="glass rounded-3xl p-8 max-w-lg text-center pop"><h2 class="text-3xl font-black">인트로를 건너뛸까요?</h2><p class="text-slate-400 mt-4">수의 범위 학습과 퀴즈를 건너뛰고 사전 설정으로 이동합니다.</p><div class="grid grid-cols-2 gap-3 mt-7"><button type="button" class="btn" onclick="renderIntro()">취소</button><button type="button" class="btn btn-primary" onclick="closeGameModal();go('setup')">건너뛰기</button></div></div></div>`}
function landingV4(){return landingCore().replace("onclick=\"playBgm('waiting');go('setup')\"","type=\"button\" onclick=\"startIntro()\"").replace('>시작하기<','>게임 시작<').replace("onclick=\"playBgm('waiting');showGuide()\"","type=\"button\" onclick=\"showGuideV2(0)\"").replace('<h1 class="sr-only">','<div class="mb-10 md:mb-14 -mt-6"><p class="text-xl md:text-3xl font-black gold">초등 5학년 2학기 수의 범위와 어림하기</p><p class="text-sm md:text-lg text-slate-300 mt-3">초등 창체, 수학 시간을 활용한 추론, 의사소통, 문제해결력 신장 활동</p></div><h1 class="sr-only">')}
function endGameV2(event){event?.preventDefault();document.body.style.overflow='hidden';document.getElementById('fx').innerHTML=`<div class="overlay"><div class="glass rounded-3xl p-8 max-w-xl w-full text-center pop"><div class="text-6xl">◇</div><h2 class="text-3xl md:text-4xl font-black mt-5">게임을 종료하시겠습니까?</h2><p class="text-slate-400 mt-4">종료하면 타이머와 진행 중인 콘택트가 중지되고 결과지 제출 링크가 활성화됩니다.</p><div class="grid grid-cols-2 gap-3 mt-8"><button type="button" class="btn" onclick="closeGameModal()">취소</button><button type="button" class="btn btn-red" onclick="commitEndGame()">게임 종료</button></div></div></div>`}
function commitEndGame(){
  // TODO: Google AI Studio - Firebase RTDB Sync Point
  gameState.timer.running=false;Object.values(contactTimers).forEach(clearInterval);contactTimers={};gameState.rooms.forEach(r=>{r.status='available';r.a=null;r.b=null;r.result=null;r.reservedBy=null;r.startedAt=null});gameState.phase='SUBMIT';localStorage.setItem(STORAGE,JSON.stringify(gameState));closeGameModal();render()
}
function resetGameV2(){document.body.style.overflow='hidden';document.getElementById('fx').innerHTML=`<div class="overlay"><div class="glass rounded-3xl p-8 max-w-lg w-full text-center pop"><h2 class="text-3xl font-black">모든 진행 상황을 초기화할까요?</h2><p class="text-slate-400 mt-4">게임 설정, 플레이 기록과 제출 결과가 모두 삭제됩니다.</p><div class="grid grid-cols-2 gap-3 mt-7"><button type="button" class="btn" onclick="closeGameModal()">취소</button><button type="button" class="btn btn-red" onclick="gameState=fresh();localStorage.setItem(STORAGE,JSON.stringify(gameState));closeGameModal();render()">초기화</button></div></div></div>`}
function copyResultsV2(){const head='순위\t팀\t고유번호\t내 번호\t타 팀\t전체정답 보너스\t역감점\t총점',lines=gameState.results.map((r,i)=>{const t=team(r.id);return `${i+1}\t${t.name}\t${t.number}\t${r.own}\t${r.others}\t${r.bonus}\t${r.penalty}\t${r.total}`}),value=[head,...lines].join('\n');navigator.clipboard.writeText(value).then(()=>showNotice('Excel 또는 한글 문서에 붙여넣을 수 있도록 복사했습니다.')).catch(()=>{document.getElementById('fx').innerHTML=`<div class="overlay"><div class="glass rounded-3xl p-6 max-w-3xl w-full"><h2 class="text-2xl font-black">결과 복사</h2><p class="text-slate-400 mt-2">아래 내용을 직접 선택해 복사하세요.</p><textarea class="w-full h-64 mt-4">${esc(value)}</textarea><button type="button" class="btn w-full mt-4" onclick="closeGameModal()">닫기</button></div></div>`})}
function numberRange(n){n=Math.max(0,Number(n)||0);if(n===0)return'0 이상 1 미만';const variants=[`${n} 이상 ${n+1} 미만`,`${n-1} 초과 ${n} 이하`,`${n-1} 초과 ${n+1} 미만`];return variants[Math.floor(Math.random()*variants.length)]}
function contactOverlayV3(r){if(r.status==='processing')return `<div class="overlay"><div class="text-center"><div class="w-20 h-20 border-4 border-slate-700 border-t-amber-400 rounded-full animate-spin mx-auto"></div><h2 class="text-4xl font-black mt-6">연산 처리 중...</h2></div></div>`;if(r.status!=='result')return'';const a=team(r.a.teamId),b=team(r.b.teamId),sec=Math.max(0,Math.ceil((r.result.until-Date.now())/1000)),pct=Math.max(0,(r.result.until-Date.now())/100),range=r.result.rangeText||(r.result.rangeText=numberRange(r.result.value));return `<div class="overlay"><div class="glass rounded-3xl w-full max-w-3xl overflow-hidden pop"><div id="contactProgress" class="progress" style="width:${pct}%"></div><div class="p-8 md:p-12 text-center"><div class="label gold">CONTACT RESULT · <span id="contactSeconds">${sec}</span>초 후 자동 종료</div><div class="flex justify-center items-center gap-6 mt-6 text-2xl"><span>${a.avatar} ${esc(a.name)}</span><span class="text-slate-600">×</span><span>${b.avatar} ${esc(b.name)}</span></div><div class="text-7xl mt-8">${META[r.result.type].icon}</div><div class="label mt-5">연산 결과가 포함된 수의 범위</div><div class="digit text-4xl md:text-6xl gold mt-4">${range}</div><p class="text-slate-400 mt-7">이 범위에 포함되는 자연수는 하나입니다. 고유번호는 공개되지 않습니다.</p></div></div></div>`}
function modalKeyHandler(e){if(!modalFlow)return;if(e.key==='Escape'){closeGameModal();return}if(modalFlow.type==='guide'&&e.key==='ArrowLeft'&&modalFlow.index>0)showGuideV2(modalFlow.index-1);if(modalFlow.type==='guide'&&e.key==='ArrowRight'&&modalFlow.index<4)showGuideV2(modalFlow.index+1)}
const gamePageDuringPlay=gamePage;gamePage=function(){return gameState.phase==='FINISH'&&gameState.results?resultBoard():gamePageDuringPlay()};
setup=setupV3;
drawPage=drawPageV2;
kiosk=kioskLandscape;
assignmentStage=assignmentStageV2;
submitPage=submitPageV4;
renderSubmitFieldsV2=renderSubmitFieldsV3;
resultBoard=resultBoardV3;
showFinalPlayerDetail=showFinalPlayerDetailV2;
resetToHome=resetToHomeV3;
audioDock=audioDockV2;
enhanceAssets=enhanceAssetsV2;
countdownFx=countdownFxV2;
finalRevealFx=finalRevealFxV2;
toggleMasterAudio=toggleMasterAudioV2;
ensurePageBgm=ensurePageBgmV2;
startGameFlow=startGameFlowV2;
showGuide=showGuideV2;
endGame=endGameV2;
contactOverlay=contactOverlayV3;
resetGame=resetGameV2;
copyResults=copyResultsV2;
const submitSheetCore=submitSheet;submitSheet=function(id){localStorage.setItem(submissionLockKey(),String(id));submitSheetCore(id)};
const playSfxCore=playSfx;playSfx=function(name,volume=.65){if(!audioBank[name])return;const a=audioBank[name].cloneNode();a.volume=Math.min(1,volume);a.play().catch(()=>{})};
const runContactCore=runContact;runContact=function(r){const roomId=r.id,players=[r.a?.teamId,r.b?.teamId].filter(Boolean);runContactCore(r);setTimeout(()=>{const live=gameState.rooms.find(x=>x.id==roomId);if(live?.result){gameState.activityLogs=gameState.activityLogs||[];const duplicate=gameState.activityLogs.some(x=>x.roomId===roomId&&x.startedAt===live.startedAt);if(!duplicate){gameState.activityLogs.push({at:Date.now(),startedAt:live.startedAt,roomId,players,ticket:live.result.type,result:live.result.value});localStorage.setItem(STORAGE,JSON.stringify(gameState))}}},1500)};
const calculateScoresCore=calculateScores;calculateScores=function(){calculateScoresCore();if(gameState.phase==='FINISH'){playSfx('cardSelected',.5);finalRevealFx()}};
const landingCore=landing;landing=landingV4;
const enhanceCurrentViewCore=enhanceCurrentView;enhanceCurrentView=function(){enhanceCurrentViewCore();if(gameState.phase==='SUBMIT'){const open=[...document.querySelectorAll('button')].find(x=>x.textContent.trim()==='열기 ↗');if(open){open.textContent='결과지 제출 페이지 열기 ↗';open.classList.add('btn-primary','px-6')}if(gameState.teams.length&&gameState.teams.every(t=>t.submittedAt)){const note=[...document.querySelectorAll('p')].find(x=>x.textContent.trim()==='모든 결과지가 제출되었습니다.');note?.remove()}}};
const renderCore=render;render=function(){renderCore();document.querySelectorAll('button:not([type])').forEach(b=>b.type='button');const mode=new URLSearchParams(location.search).get('mode')||'home';document.body.className=`noise mode-${gameState.phase==='FINISH'?'result':mode}`;if(mode==='game'&&gameState.phase!=='FINISH'){const h=document.querySelector('#app header');if(h&&!h.querySelector('.display-activate'))h.insertAdjacentHTML('afterbegin',`<div class="w-full flex justify-end mb-3">${boardButton()}</div>`)}if(mode==='board')document.getElementById('app').insertAdjacentHTML('beforeend',audioDock());enhanceAssets();enhanceCurrentView();ensurePageBgm()};
document.addEventListener('pointerdown',e=>{const mode=new URLSearchParams(location.search).get('mode')||'home';if(mode==='board'&&gameState.bgmPlaying!==false)playBgm(desiredBgm());const b=e.target.closest('button');if(b&&!b.disabled)beep('click')},{passive:true});
document.addEventListener('keydown',modalKeyHandler);
window.addEventListener('popstate',render);window.addEventListener('storage',e=>{if(e.key===STORAGE){let before=null,after=null;try{before=JSON.parse(e.oldValue);after=JSON.parse(e.newValue)}catch{}if(before&&after){const a={...before},b={...after};delete a.timer;delete b.timer;delete a.activityLogs;delete b.activityLogs;if(JSON.stringify(a)===JSON.stringify(b)){gameState=after;applyTimerDom();return}}gameState=load();render();if(before?.phase!=='FINISH'&&after?.phase==='FINISH')setTimeout(finalRevealFx,80)}});setInterval(()=>{if(gameState.timer.running)updateTimerOnly()},1000);render();
</script></body></html>
